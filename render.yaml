services:
  - type: web
    name: servidor-historias-clinicas
    env: python
    buildCommand: pip install -r requirements.txt && playwright install chromium || true
    startCommand: python server.py --host 0.0.0.0 --port $PORT --no-browser
    envVars:
      - key: HCLINICAS_API_HOST
        value: "0.0.0.0"
